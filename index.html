<!DOCTYPE html>
<html lang="es" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyper Bee Wash Control | Sistema de Gestión para Autolavados</title>
    <meta name="description" content="Software profesional para la gestión de autolavados. Registro de servicios, cierre de caja, nómina automática, reportes y más. Organiza y digitaliza tu negocio con Hyper Bee.">
    <meta property="og:title" content="Wash Control | Gestión moderna para autolavados">
    <meta property="og:description" content="Organiza servicios, caja, empleados y reportes desde una plataforma diseñada para modernizar la operación de tu autolavado.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="./images/Fondo%20carro.png">
    <!-- og:url pendiente de configurar cuando exista una URL pública -->
    <!-- Favicon necesario: <link rel="icon" type="image/x-icon" href="/favicon.ico"> -->
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=Playfair+Display:ital,wght@0,400;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Material Symbols -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['Outfit', 'sans-serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        brand: {
                            deep: '#020617',
                            surface: '#0f172a',
                            yellow: '#fbbf24',
                            emerald: '#10b981',
                            border: 'rgba(255,255,255,0.08)'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: #020617;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Interactive Geometric Background */
        .grid-pattern {
            position: absolute;
            inset: -20%;
            width: 140%;
            height: 140%;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px),
                linear-gradient(rgba(251, 191, 36, 0.08) 2px, transparent 2px),
                linear-gradient(90deg, rgba(251, 191, 36, 0.08) 2px, transparent 2px);
            background-size: 40px 40px, 40px 40px, 200px 200px, 200px 200px;
            background-position: center auto;
            z-index: 0;
            pointer-events: none;
            -webkit-mask-image: radial-gradient(ellipse at center, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0) 80%);
            mask-image: radial-gradient(ellipse at center, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0) 80%);
        }

        .cursor-glow {
            position: absolute;
            top: 0;
            left: 0;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(251, 191, 36, 0.35) 0%, rgba(59, 130, 246, 0.20) 40%, transparent 60%);
            pointer-events: none;
            z-index: 1;
            border-radius: 50%;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.3);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .glass-card:hover {
            border-color: rgba(251, 191, 36, 0.2);
            transform: translateY(-8px) scale(1.01);
            background: rgba(30, 41, 59, 0.4);
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6);
        }

        .text-gradient-gold {
            background: linear-gradient(135deg, #fbbf24 0%, #fcd34d 50%, #f59e0b 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.1));
        }

        .btn-primary {
            position: relative;
            background: #fbbf24;
            color: #020617;
            border: 1px solid #fbbf24;
            overflow: hidden;
            z-index: 1;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #020617;
            transform: translateY(100%);
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            z-index: -1;
            border-radius: inherit;
        }

        .btn-primary:hover {
            color: #fbbf24;
            box-shadow: 0 20px 40px -10px rgba(251, 191, 36, 0.3);
            transform: scale(1.02);
            border-color: rgba(251, 191, 36, 0.5);
        }

        .btn-primary:hover::before {
            transform: translateY(0);
        }

        /* Navbar Specific Animations */
        .nav-link {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            border-radius: 100px;
            border: 1px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-link:hover {
            background: rgba(251, 191, 36, 0.05);
            border-color: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
        }

        .nav-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            overflow: hidden;
            border-radius: 100px;
            border: 1px solid rgba(251, 191, 36, 0.3);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .nav-btn .btn-icon {
            width: 0;
            opacity: 0;
            transform: translateX(-20px);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .nav-btn:hover {
            background: white !important;
            color: #0f172a !important;
            gap: 12px;
            padding-left: 20px;
            padding-right: 28px;
        }

        .nav-btn:hover .btn-icon {
            width: 24px;
            opacity: 1;
            transform: translateX(0);
        }

        .reveal {
            opacity: 0;
            transform: translateY(40px);
        }

        @keyframes scaleUp {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Mobile Menu */
        .mobile-menu {
            transform: translateX(100%);
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .mobile-menu.open {
            transform: translateX(0);
        }

        .mobile-menu-overlay {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .mobile-menu-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: #020617;
        }

        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #fbbf24;
        }

        /* ═══════════════════════════════════════════ */
        /* CTA FINAL — PREMIUM CINEMATIC SECTION      */
        /* ═══════════════════════════════════════════ */

        .cta-final {
            position: relative;
            overflow: hidden;
            min-height: 760px;
            display: flex;
            align-items: center;
        }

        /* Vehicle image layer — separate for transform animation */
        .cta-final__vehicle-layer {
            position: absolute;
            inset: 0;
            background-image: url('images/Fondo carro.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: 60% center;
            pointer-events: none;
            will-change: transform;
            transform-origin: 60% 50%;
        }

        /* Dark lateral gradient — left side for text readability */
        .cta-final__overlay-lateral {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                90deg,
                rgba(2, 6, 23, 0.92) 0%,
                rgba(2, 6, 23, 0.80) 28%,
                rgba(2, 6, 23, 0.45) 52%,
                rgba(2, 6, 23, 0.10) 72%,
                transparent 100%
            );
            pointer-events: none;
            z-index: 1;
        }

        /* Bottom gradient — blends into footer */
        .cta-final__overlay-bottom {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 200px;
            background: linear-gradient(
                to bottom,
                transparent 0%,
                rgba(2, 6, 23, 0.4) 30%,
                rgba(2, 6, 23, 0.85) 70%,
                #020617 100%
            );
            pointer-events: none;
            z-index: 1;
        }

        /* Top vignette */
        .cta-final__overlay-top {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 160px;
            background: linear-gradient(
                to bottom,
                rgba(2, 6, 23, 0.7) 0%,
                transparent 100%
            );
            pointer-events: none;
            z-index: 1;
        }

        /* Subtle blue glow behind vehicle */
        .cta-final__glow {
            position: absolute;
            top: 30%;
            right: 20%;
            width: 500px;
            height: 400px;
            background: radial-gradient(ellipse, rgba(59, 130, 246, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
            filter: blur(60px);
        }

        /* Inner vignette */
        .cta-final__vignette {
            position: absolute;
            inset: 0;
            box-shadow: inset 0 0 200px 40px rgba(2, 6, 23, 0.4);
            pointer-events: none;
            z-index: 1;
        }

        /* Content wrapper */
        .cta-final__content {
            position: relative;
            z-index: 10;
            max-width: 1280px;
            width: 100%;
            margin: 0 auto;
            padding: 0 clamp(20px, 5vw, 64px);
            display: flex;
            align-items: center;
        }

        .cta-final__text-block {
            max-width: 580px;
        }

        /* Tag / Label */
        .cta-final__tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 100px;
            background: rgba(251, 191, 36, 0.08);
            border: 1px solid rgba(251, 191, 36, 0.18);
            margin-bottom: 24px;
        }

        .cta-final__tag span {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: #fbbf24;
        }

        /* Title */
        .cta-final__title {
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: clamp(2rem, 4.5vw, 3.75rem);
            line-height: 1.05;
            color: #ffffff;
            letter-spacing: -0.03em;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .cta-final__title-highlight {
            color: #fbbf24;
        }

        /* Description */
        .cta-final__desc {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: clamp(0.95rem, 1.5vw, 1.18rem);
            line-height: 1.7;
            color: #94a3b8;
            font-weight: 300;
            margin-bottom: 36px;
            max-width: 480px;
        }

        /* Buttons container */
        .cta-final__buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
        }

        /* Primary CTA button */
        .cta-btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 36px;
            border-radius: 16px;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: #020617;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            text-decoration: none;
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 4px 24px -6px rgba(251, 191, 36, 0.25);
            min-height: 52px;
        }

        .cta-btn-primary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 40px -8px rgba(251, 191, 36, 0.4);
        }

        .cta-btn-primary:active {
            transform: translateY(0) scale(0.98);
            box-shadow: 0 2px 12px -4px rgba(251, 191, 36, 0.3);
        }

        .cta-btn-primary:focus-visible {
            outline: 2px solid #fbbf24;
            outline-offset: 3px;
        }

        /* Secondary CTA button */
        .cta-btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 36px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #e2e8f0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.10);
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            min-height: 52px;
        }

        .cta-btn-secondary:hover {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(251, 191, 36, 0.25);
            color: #fbbf24;
            transform: translateY(-2px);
        }

        .cta-btn-secondary:active {
            transform: translateY(0);
            background: rgba(255, 255, 255, 0.06);
        }

        .cta-btn-secondary:focus-visible {
            outline: 2px solid rgba(251, 191, 36, 0.6);
            outline-offset: 3px;
        }

        /* ── Animation States ── */
        .cta-animate {
            opacity: 0;
            transform: translateY(30px);
            filter: blur(4px);
            transition:
                opacity 0.85s cubic-bezier(0.23, 1, 0.32, 1),
                transform 0.85s cubic-bezier(0.23, 1, 0.32, 1),
                filter 0.85s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .cta-animate.is-visible {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
        }

        /* Vehicle entrance */
        .cta-final__vehicle-layer {
            opacity: 0;
            transform: scale(1.05);
            transition:
                opacity 1.2s cubic-bezier(0.23, 1, 0.32, 1),
                transform 1.8s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .cta-final__vehicle-layer.is-visible {
            opacity: 1;
            transform: scale(1);
        }

        /* Light sweep — one-time overlay effect */
        .cta-final__light-sweep {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                105deg,
                transparent 40%,
                rgba(255, 255, 255, 0.03) 45%,
                rgba(255, 255, 255, 0.06) 50%,
                rgba(255, 255, 255, 0.03) 55%,
                transparent 60%
            );
            transform: translateX(-120%);
            pointer-events: none;
            z-index: 2;
        }

        .cta-final__light-sweep.is-visible {
            animation: ctaLightSweep 1.8s 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        @keyframes ctaLightSweep {
            to { transform: translateX(120%); }
        }

        /* ── Responsive — Breakpoints ── */

        /* 1440px+ */
        @media (min-width: 1441px) {
            .cta-final { min-height: 820px; }
            .cta-final__vehicle-layer { background-position: 55% center; }
        }

        /* 1280px */
        @media (max-width: 1280px) {
            .cta-final { min-height: 720px; }
            .cta-final__vehicle-layer { background-position: 62% center; }
        }

        /* 1024px — Tablet landscape */
        @media (max-width: 1024px) {
            .cta-final { min-height: 680px; }
            .cta-final__vehicle-layer { background-position: 65% center; }
            .cta-final__overlay-lateral {
                background: linear-gradient(
                    90deg,
                    rgba(2, 6, 23, 0.93) 0%,
                    rgba(2, 6, 23, 0.82) 32%,
                    rgba(2, 6, 23, 0.50) 58%,
                    rgba(2, 6, 23, 0.15) 80%,
                    transparent 100%
                );
            }
            .cta-final__text-block { max-width: 480px; }
        }

        /* 768px — Tablet portrait */
        @media (max-width: 768px) {
            .cta-final { min-height: 640px; align-items: flex-end; padding-bottom: 80px; }
            .cta-final__vehicle-layer { background-position: 68% 35%; }
            .cta-final__overlay-lateral {
                background: linear-gradient(
                    180deg,
                    rgba(2, 6, 23, 0.3) 0%,
                    rgba(2, 6, 23, 0.65) 40%,
                    rgba(2, 6, 23, 0.92) 70%,
                    rgba(2, 6, 23, 0.98) 100%
                );
            }
            .cta-final__text-block { max-width: 100%; }
            .cta-final__buttons { flex-direction: column; width: 100%; }
            .cta-btn-primary,
            .cta-btn-secondary { width: 100%; justify-content: center; }
            .cta-final__glow { right: 10%; top: 10%; width: 350px; height: 280px; }
        }

        /* 430px — Large phone */
        @media (max-width: 430px) {
            .cta-final { min-height: 600px; padding-bottom: 60px; }
            .cta-final__vehicle-layer { background-position: 65% 30%; }
            .cta-final__tag { margin-bottom: 18px; }
            .cta-final__tag span { font-size: 9px; letter-spacing: 0.2em; }
            .cta-final__title { margin-bottom: 16px; }
            .cta-final__desc { margin-bottom: 28px; }
            .cta-final__overlay-lateral {
                background: linear-gradient(
                    180deg,
                    rgba(2, 6, 23, 0.25) 0%,
                    rgba(2, 6, 23, 0.70) 35%,
                    rgba(2, 6, 23, 0.95) 65%,
                    #020617 100%
                );
            }
        }

        /* 390px */
        @media (max-width: 390px) {
            .cta-final { min-height: 580px; }
            .cta-final__vehicle-layer { background-position: 62% 28%; }
            .cta-btn-primary,
            .cta-btn-secondary { padding: 14px 24px; font-size: 11px; }
        }

        /* 360px — Small phone */
        @media (max-width: 360px) {
            .cta-final { min-height: 560px; }
            .cta-final__vehicle-layer { background-position: 60% 28%; }
        }

        /* ── Reduced Motion ── */
        @media (prefers-reduced-motion: reduce) {
            .cta-animate {
                opacity: 1 !important;
                transform: none !important;
                filter: none !important;
                transition: none !important;
            }
            .cta-final__vehicle-layer {
                opacity: 1 !important;
                transform: none !important;
                transition: none !important;
            }
            .cta-final__light-sweep {
                display: none !important;
            }
            .cta-btn-primary,
            .cta-btn-secondary {
                transition: background 0.2s, color 0.2s, border-color 0.2s !important;
            }
            .cta-btn-primary:hover,
            .cta-btn-secondary:hover {
                transform: none !important;
            }
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const WHATSAPP_URL = "https://wa.me/50557042498?text=Hola%2C%20vi%20la%20plataforma%20de%20gesti%C3%B3n%20para%20autolavados%20de%20Hyperbee%20Solutions%20y%20me%20gustar%C3%ADa%20solicitar%20una%20demostraci%C3%B3n.";

        const Icon = ({ name, className = "" }) => (
            <span className={`material-symbols-outlined ${className}`}>{name}</span>
        );

        const Nav = () => {
            const [menuOpen, setMenuOpen] = useState(false);

            const navItems = [
                { name: 'Solución', id: 'modulos' },
                { name: 'Por qué nosotros', id: 'features' },
                { name: 'Planes', id: 'precios' }
            ];

            const scrollTo = (id) => {
                setMenuOpen(false);
                document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
            };

            return (
                <header className="fixed top-0 w-full z-[100] bg-[#020617]/70 backdrop-blur-2xl border-b border-white/5 py-4 px-6 md:px-8">
                    <div className="max-w-7xl mx-auto flex justify-between items-center">

                        {/* 1. Brand Logo (Left) */}
                        <div className="w-1/3 flex justify-start">
                            <div className="flex items-center gap-4 cursor-pointer">
                                <div className="bg-brand-yellow p-2.5 rounded-2xl shadow-2xl shadow-brand-yellow/10">
                                    <Icon name="local_car_wash" className="text-brand-deep font-bold" />
                                </div>
                                <div className="hidden lg:flex flex-col">
                                    <span className="text-lg font-black text-white italic tracking-tighter uppercase leading-none">
                                        Hyper <span className="text-brand-yellow">Bee</span>
                                    </span>
                                    <span className="text-[9px] font-black uppercase tracking-[0.3em] text-slate-500 mt-1 italic">Software de Control</span>
                                </div>
                            </div>
                        </div>

                        {/* 2. Desktop Menu (Center) */}
                        <nav className="w-1/3 hidden md:flex items-center justify-center gap-1 lg:gap-3" aria-label="Navegación principal">
                            {navItems.map((item) => (
                                <a
                                    key={item.id}
                                    href={`#${item.id}`}
                                    onClick={(e) => {
                                        e.preventDefault();
                                        scrollTo(item.id);
                                    }}
                                    className="nav-link px-5 py-2.5 text-[10px] font-bold uppercase tracking-[0.2em] text-slate-400"
                                >
                                    {item.name}
                                </a>
                            ))}
                        </nav>

                        {/* 3. Action Button (Right) */}
                        <div className="w-1/3 hidden md:flex justify-end">
                            <a

        const CtaFinal = () => {
            const sectionRef = useRef(null);
            const vehicleRef = useRef(null);
            const sweepRef = useRef(null);
            const animatedRef = useRef(false);

            useEffect(() => {
                const section = sectionRef.current;
                const vehicle = vehicleRef.current;
                const sweep = sweepRef.current;
                if (!section || !vehicle) return;

                const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

                if (prefersReduced) {
                    // Show everything immediately
                    vehicle.classList.add('is-visible');
                    section.querySelectorAll('.cta-animate').forEach(el => el.classList.add('is-visible'));
                    return;
                }

                // IntersectionObserver for entry animations
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting && !animatedRef.current) {
                            animatedRef.current = true;

                            // Vehicle entrance
                            vehicle.classList.add('is-visible');

                            // Light sweep
                            if (sweep) sweep.classList.add('is-visible');

                            // Staggered text animations
                            const animElements = section.querySelectorAll('.cta-animate');
                            animElements.forEach((el, i) => {
                                setTimeout(() => {
                                    el.classList.add('is-visible');
                                }, 200 + (i * 110));
                            });
                        }
                    });
                }, { threshold: 0.2 });

                observer.observe(section);

                // Cursor parallax — desktop only, pointer:fine
                const hasPointer = window.matchMedia('(pointer: fine)').matches;
                let rafId = null;
                let targetX = 0;
                let targetY = 0;
                let currentX = 0;
                let currentY = 0;

                const handleMouseMove = (e) => {
                    if (!hasPointer) return;
                    const rect = section.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;
                    targetX = ((e.clientX - centerX) / rect.width) * 8;
                    targetY = ((e.clientY - centerY) / rect.height) * 5;
                };

                const animateParallax = () => {
                    currentX += (targetX - currentX) * 0.06;
                    currentY += (targetY - currentY) * 0.06;
                    if (vehicle && animatedRef.current) {
                        vehicle.style.transform = `scale(1) translate(${currentX}px, ${currentY}px)`;
                    }
                    rafId = requestAnimationFrame(animateParallax);
                };

                if (hasPointer) {
                    section.addEventListener('mousemove', handleMouseMove);
                    rafId = requestAnimationFrame(animateParallax);
                }

                // GSAP scroll-based subtle Y movement on vehicle
                gsap.registerPlugin(ScrollTrigger);
                const scrollCtx = gsap.context(() => {
                    gsap.to(vehicle, {
                        y: -18,
                        ease: 'none',
                        scrollTrigger: {
                            trigger: section,
                            start: 'top bottom',
                            end: 'bottom top',
                            scrub: 1.2,
                        }
                    });
                });

                return () => {
                    observer.disconnect();
                    if (hasPointer) {
                        section.removeEventListener('mousemove', handleMouseMove);
                        if (rafId) cancelAnimationFrame(rafId);
                    }
                    scrollCtx.revert();
                };
            }, []);

            const scrollToSection = (e) => {
                e.preventDefault();
                document.getElementById('modulos')?.scrollIntoView({ behavior: 'smooth' });
            };

            return (

                    aria-label="Llamada a la acción — Digitaliza hoy tu autolavado"
